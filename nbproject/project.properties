# Project properties for the NetBeans (Ant) project DRS-Initial.
# COIT20258 Software Engineering, Assessment 2.

annotation.processing.enabled=true
annotation.processing.enabled.in.editor=false
annotation.processing.processors.list=
annotation.processing.run.all.processors=true
annotation.processing.source.output=${build.generated.sources.dir}/ap-source-output

application.title=DRS-Initial
application.vendor=Venkatesh Kumar Manjunath (12310516)

build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form
build.dir=build
build.generated.dir=${build.dir}/generated
build.generated.sources.dir=${build.dir}/generated-sources
build.sysclasspath=ignore
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results

debug.classpath=${run.classpath}
debug.test.classpath=${run.test.classpath}

dist.dir=dist
dist.jar=${dist.dir}/DRS-Initial.jar
dist.javadoc.dir=${dist.dir}/javadoc

excludes=
includes=**

# Third-party libraries shipped with the project, so that the prototype builds
# with nothing installed but a JDK. The JavaFX jars are platform specific; the
# -pre-init target in build.xml selects the folder matching the machine that is
# building the project.
file.reference.sqlite-jdbc.jar=lib/sqlite-jdbc-3.46.1.0.jar
file.reference.slf4j-api.jar=lib/slf4j-api-1.7.36.jar
file.reference.mysql-connector-j.jar=lib/mysql-connector-j-8.4.0.jar
file.reference.junit-console.jar=lib/junit-platform-console-standalone-1.10.2.jar

javac.classpath=\
    ${file.reference.sqlite-jdbc.jar}:\
    ${file.reference.slf4j-api.jar}:\
    ${file.reference.mysql-connector-j.jar}
javac.compilerargs=--module-path ${javafx.module.path} --add-modules ${javafx.modules}
javac.deprecation=false
javac.external.vm=false
javac.processorpath=${javac.classpath}
javac.source=17
javac.target=17
javac.test.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}:\
    ${file.reference.junit-console.jar}
javac.test.processorpath=${javac.test.classpath}

javadoc.additionalparam=
javadoc.author=true
javadoc.encoding=${source.encoding}
javadoc.noindex=false
javadoc.nonavbar=false
javadoc.notree=false
javadoc.private=true
javadoc.splitindex=false
javadoc.use=true
javadoc.version=true
javadoc.windowtitle=DRS-Initial API documentation

main.class=au.edu.cqu.drs.client.ClientLauncher

manifest.file=manifest.mf
meta.inf.dir=${src.dir}/META-INF

mkdist.disabled=false
platform.active=default_platform

run.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}
run.jvmargs=--module-path ${javafx.module.path} --add-modules ${javafx.modules}
run.test.classpath=\
    ${javac.test.classpath}:\
    ${build.test.classes.dir}

source.encoding=UTF-8
src.dir=src
test.src.dir=test
