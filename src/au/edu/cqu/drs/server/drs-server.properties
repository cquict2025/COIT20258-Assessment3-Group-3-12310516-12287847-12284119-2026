# Default DRS server settings. To change them, put a drs-server.properties
# file with any of these keys in the folder the server is started from, or
# pass --config <file>.

# TCP port clients connect to.
port=5050
# Worker threads, which is the most clients served at the same time.
threads=32
# Storage: mysql, sqlite or memory.
repository=mysql
# SQLite database file, created on first start (repository=sqlite).
database.file=drs.db
# Minutes a connection may stay silent before the server closes it.
client.timeout.minutes=30
# Minutes a session may stay idle before the user must sign in again.
session.idle.minutes=30

# MySQL (repository=mysql). The database and tables are created on first
# start if the account may create them; or run sql/schema.sql and
# sql/seed.sql first. Keep the password out of shared files: set the
# DRS_MYSQL_PASSWORD environment variable, or put mysql.password in a local
# drs-server.properties that is never committed.
mysql.host=localhost
mysql.port=3306
mysql.database=drs
mysql.user=drs
mysql.password=
mysql.pool.size=8
mysql.allow.public.key.retrieval=true

# Keystore holding the key that encrypts reporters' names and contacts
# (repository=mysql), created on first start. Set its password with the
# DRS_KEYSTORE_PASSWORD environment variable; without one, personal details
# are stored unencrypted and data imports are refused.
keystore.file=drs-keystore.p12
keystore.password=
