# Command modules loaded by au.edu.cqu.drs.server.ModuleRegistry.
# One line per module: any unique key, then the fully qualified class name.
# Modules load in key order. A class that is not on the classpath yet is
# logged and skipped, so a line can be listed before its module is merged.
# See docs/design/hooks.md.
module.1.warning=au.edu.cqu.drs.server.modules.warning.WarningModule
# "import" is a Java keyword and cannot be a package name, hence "importer".
module.2.import=au.edu.cqu.drs.server.modules.importer.ImportModule
